version: "3.0"

services:
  api:
    build:
      context: .
    image: crm-moleculer-customer-reports
    env_file: docker-compose.env
    environment:
      SERVICES: api
      PORT: 3000
    links:
      - nats
      - redis
      - mongo
    depends_on:
      - nats
      - redis
      - mongo
    labels:
      - "traefik.enable=true"
      - "traefik.backend=api"
      - "traefik.port=3000"
      - "traefik.frontend.entryPoints=http"
      - "traefik.frontend.rule=PathPrefix:/"

  greeter:
    build:
      context: .
    image: crm-moleculer-customer-reports
    env_file: docker-compose.env
    environment:
      SERVICES: greeter
    links:
      - nats
      - redis
      - mongo
    depends_on:
      - nats
      - redis
      - mongo

  nats:
    image: nats
  redis:
    image: redis:alpine

  mongo:
    image: mongo

  traefik:
    image: traefik
    command: --web --docker --docker.domain=docker.localhost --logLevel=INFO --docker.exposedbydefault=false
    ports:
      - "3000:80"
      - "3001:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/null:/traefik.toml
